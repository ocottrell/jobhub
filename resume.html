function buildCover(){
  var L=[];
  L.push('Please write me a cover letter for a job I am applying for. My details are below.');
  L.push('');
  L.push('THE JOB I AM APPLYING FOR');
  if(D.postCo) L.push('Company: '+D.postCo);
  L.push('The posting, exactly as it was written:');
  L.push(D.posting || '(I did not paste it - please ask me for the job posting before writing.)');
  L.push('');
  if(D.postWhy){ L.push('WHY I WANT THIS JOB (my own words)'); L.push(D.postWhy); L.push(''); }
  if(D.postRef){
    L.push('SOMEONE I KNOW THERE');
    L.push(D.postRef);
    L.push('Please work this connection into the opening line - it matters more than anything else in the letter.');
    L.push('');
  }

  if(D.resume){
    L.push('MY RESUME');
    L.push(D.resume);
  } else {
    L.push('MY BACKGROUND');
    L.push('Name: '+(D.contact.name||'(ask me)'));
    L.push('City: '+(D.contact.city||'(ask me)'));
    if(D.target) L.push('I am aiming for work as: '+D.target);
    if(D.jobs.length){
      D.jobs.forEach(function(j,i){
        var yr = j.y1 ? (j.y1+' to '+(j.y2==='Still there'?'present':(j.y2||'present'))) : '';
        L.push((i+1)+'. '+[j.title,j.where?('at '+j.where):'',yr?('('+yr+')'):''].filter(Boolean).join(' '));
        if(j.duties) L.push('   What I did: '+j.duties);
        if(j.wins)   L.push('   What I improved: '+j.wins);
      });
    }
    if(D.skills.length) L.push('Things I can do: '+D.skills.join(', '));
    if(D.skillsOther)   L.push('Also can do: '+D.skillsOther);
    if(D.other)         L.push('Other work I have done: '+D.other);
  }

  L.push('');
  L.push('HOW I WOULD LIKE IT WRITTEN');
  L.push('- Three or four short paragraphs on one page. Plain text, no letterhead, no graphics.');
  L.push('- Point at the things in the posting I actually match, using my real experience.');
  L.push('- Sound like a real person, not a template. Confident but not boastful.');
  L.push('- IMPORTANT: do not invent any experience, skill or qualification I did not give you. If something is missing, ASK ME instead of making it up.');
  L.push('');
  L.push('THEN, AFTER THE LETTER');
  L.push('Give me a short, honest read on how well I match this job:');
  L.push('- Which requirements I clearly meet.');
  L.push('- Which ones I do not meet, and whether that is likely to matter.');
  L.push('- Whether this one is worth applying for, in your opinion.');
  return L.join('\n');
}

function buildInterview(){
  var L=[];
  L.push('I have an interview coming up and I want to get ready for it. Please help me practise.');
  L.push('');

  if(D.posting){
    L.push('THE JOB');
    if(D.postCo) L.push('Company: '+D.postCo);
    L.push('The posting, exactly as it was written:');
    L.push(D.posting);
  } else {
    L.push('THE JOB');
    L.push(D.target ? ('I am interviewing for work as: '+D.target)
                    : '(I have not told you what job this is for - please ask me before we start.)');
  }
  L.push('');

  if(D.resume){
    L.push('MY RESUME');
    L.push(D.resume);
  } else {
    L.push('MY BACKGROUND');
    L.push('Name: '+(D.contact.name||'(ask me)'));
    if(D.jobs.length){
      D.jobs.forEach(function(j,i){
        var yr = j.y1 ? (j.y1+' to '+(j.y2==='Still there'?'present':(j.y2||'present'))) : '';
        L.push((i+1)+'. '+[j.title,j.where?('at '+j.where):'',yr?('('+yr+')'):''].filter(Boolean).join(' '));
        if(j.duties) L.push('   What I did: '+j.duties);
        if(j.wins)   L.push('   What I improved: '+j.wins);
      });
    } else {
      L.push('I have not had a job before - this would be my first.');
    }
    if(D.skills.length) L.push('Things I can do: '+D.skills.join(', '));
    if(D.skillsOther)   L.push('Also can do: '+D.skillsOther);
    if(D.other)         L.push('Other work I have done: '+D.other);
    var lv=(D.edu.levels||[]).filter(function(x){return x!=='None of these';});
    if(lv.length)       L.push('School and training: '+lv.join(', '));
    if(D.edu.certs)     L.push('Certificates and licenses: '+D.edu.certs);
    if(D.edu.other)     L.push('Other training: '+D.edu.other);
  }

  if(D.goal==='ended' || D.goal==='back'){
    L.push('');
    L.push('SOMETHING I AM WORRIED ABOUT');
    L.push(D.goal==='ended'
      ? 'My last job ended and they may ask me why. Help me give a short, honest answer that does not sound defensive.'
      : 'I have been out of work for a while and they may ask about the gap. Help me answer it plainly without apologising for it.');
  }

  L.push('');
  L.push('WHAT I NEED FROM YOU');
  L.push('1. A list of the questions I am most likely to be asked for THIS job, based on the posting and my background. Put the most likely ones first.');
  L.push('2. The handful of questions almost every interview includes.');
  L.push('3. Any question my own history might invite - a gap, short stints, changing fields, or thin experience - and how to answer it honestly.');
  L.push('4. Four or five good questions for ME to ask THEM. Most people freeze when the interviewer asks "do you have any questions," and having some ready makes a real difference.');
  L.push('');
  L.push('THEN LET ME PRACTISE');
  L.push('After the list, please coach me one question at a time:');
  L.push('- Ask me ONE question and wait for my answer. Do not ask several at once.');
  L.push('- When I answer, tell me plainly what was good and what to change. Be honest - I would rather hear it from you than lose the job.');
  L.push('- If my answer is too short or too long, say so and show me a better version using MY words and MY real experience.');
  L.push('- Keep going until I say stop.');
  L.push('');
  L.push('IMPORTANT: do not invent any experience or qualification I did not give you. If you need to know something, ask me.');
  L.push('Keep your language plain and straightforward. I am not a professional writer and I do not want to sound like one in the interview.');
  return L.join('\n');
}

function saveFile(name, text){
  if(!text){ return; }
  // Try the artifact runtime first, then fall back to an ordinary browser download.
  var fallback = function(){
    try{
      var blob = new Blob([text], {type:'text/plain;charset=utf-8'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
    }catch(e){}
  };
  try{
    if(window.claude && window.claude.use){
      window.claude.use('downloads').then(function(d){
        if(d && d.save){ d.save({filename:name, data:text}).catch(fallback); } else { fallback(); }
      }, fallback);
      return;
    }
  }catch(e){}
  fallback();
}

function mailTo(subject, body){
  var href = 'mailto:' + encodeURIComponent(D.contact.email||'') +
             '?subject=' + encodeURIComponent(subject) +
             '&body=' + encodeURIComponent(body||'');

  // A browser never reports whether a mailto: opened anything. What it does
  // reliably report is losing focus - which is what happens when a mail app
  // takes over. If focus never leaves after ~1.5s, nothing opened.
  var handed = false;
  var noted = function(){ handed = true; };
  document.addEventListener('visibilitychange', noted);
  window.addEventListener('blur', noted);
  window.addEventListener('pagehide', noted);

  try{ window.location.href = href; }catch(e){}

  setTimeout(function(){
    document.removeEventListener('visibilitychange', noted);
    window.removeEventListener('blur', noted);
    window.removeEventListener('pagehide', noted);
    if(handed || document.hidden) return;
    var box = document.getElementById('mailfail');
    if(box){ box.hidden = false; box.scrollIntoView({block:'nearest'}); }
  }, 1500);
}

  var L = [];

  L.push('');
  L.push('WHAT I AM LOOKING FOR');
  L.push(GOAL_NOTE[D.goal] || 'I am looking for work.');
  if(D.target)  L.push('The job I am going for: ' + D.target + '. Aim the whole resume at this job - the summary, the wording, and which duties get the most room.');
  if(D.target2) L.push('I would also take: ' + D.target2 + '.');
  if(!D.target) L.push('I have not settled on a job title yet. Ask me what kind of work I am aiming for before you write the summary.');
  L.push('');
  L.push('MY CONTACT INFORMATION');
  L.push('Name: '  + (D.contact.name  || '(ask me)'));
  L.push('Phone: ' + (D.contact.phone || '(ask me)'));
  L.push('Email: ' + (D.contact.email || '(ask me)'));
  L.push('City: '  + (D.contact.city  || '(ask me)'));

  if(D.jobs.length){
    L.push('');
    L.push('JOBS I HAVE HAD');
    D.jobs.forEach(function(j,i){
      var head = [j.title||'(job title not given)', j.where?('at '+j.where):''].filter(Boolean).join(' ');
      var yr = j.y1 ? (j.y1 + ' to ' + (j.y2==='Still there' ? 'present (still working there)' : (j.y2||'present'))) : '';
      var meta = [j.prof||j.kind, yr].filter(Boolean).join(', ');
      L.push((i+1)+'. '+head+(meta?' ('+meta+')':''));
      L.push('   In my own words, what I did day to day: '+(j.duties||'(I did not fill this in - please ask me)'));
      if(j.wins) L.push('   Things I improved there: '+j.wins);
    });
  } else {
    L.push('');
    L.push('JOBS I HAVE HAD');
    L.push('None yet - this would be my first job.');
  }

  if(D.skills.length || D.skillsOther){
    L.push('');
    L.push('THINGS I CAN DO');
    if(D.skills.length) L.push(D.skills.join(', '));
    if(D.skillsOther)   L.push('In my own words: '+D.skillsOther);
  }

  if(D.other){
    L.push('');
    L.push('OTHER THINGS I WANT AN EMPLOYER TO KNOW');
    L.push(D.other);
    L.push('(Work this in wherever it fits best - it may belong in the summary, as its own section, or under a job.)');
  }

  var lv = (D.edu.levels||[]).filter(function(x){return x!=='None of these';});
  if(lv.length || D.edu.field || D.edu.school || D.edu.other){
    L.push('');
    L.push('SCHOOL AND TRAINING');
    if(lv.length)        L.push(lv.join(', '));
    if(D.edu.field)      L.push('Field of study: '+D.edu.field);
    if(D.edu.school)     L.push('School or program: '+D.edu.school);
    if(D.edu.certs)      L.push('Certificates and licenses I hold: '+D.edu.certs);
    if(D.edu.other)      L.push('Other training and skills I picked up: '+D.edu.other);
  }

  L.push('');
  L.push('HOW I WOULD LIKE IT WRITTEN');
  L.push('- One page, plain and simple, in a single column. No tables, no columns, no graphics - it has to survive being pasted into a job application.');
  L.push('- Turn my plain wording into clear professional phrasing, but keep it honest and keep it sounding like a real person.');
  L.push('- Use short bullet points under each job.');
  L.push('- Where I gave you a number or a result, keep it in and put it near the front of that job. Numbers are the strongest thing on a resume.');
  L.push('- Put a short summary at the top, two or three lines.');
  L.push('- IMPORTANT: do not invent any job, date, skill, duty or achievement that I did not give you. If something important is missing or unclear, ASK ME a question instead of making it up.');
  L.push('- After you show me the resume, tell me in plain language what would make it stronger, and offer to help me fix it.');

  return L.join('\n');
}

function aimPhrase(){ return D.target ? ('help you get work as '+esc(D.target)) : 'help with the job you want'; }

function render(){
  var h='', nextTxt='Continue', showSkip=false, hideNext=false;
  var DETOUR = {21:2, 61:6, 81:8};

  if(step===1){

  else if(step===21){

  else if(step===61){

      'letter made for that exact job.</p>'+

      '<button class="big" data-act="fork" data-v="done">I\'m done for now<small>Come back anytime; everything is saved.</small></button>';

      '<p class="note">Copy the whole listing — duties, requirements, all of it. The more it has, '+

      '<textarea id="post" placeholder="Paste the job posting here" style="min-height:220px">'+esc(D.posting)+'</textarea>'+

    showSkip=true;
    nextTxt='Make my cover letter';
  }

  else if(step===20){
    h='<h1>You\'re set.</h1>'+
      '<p class="note">Everything you entered is saved on this phone. Come back whenever you find '+

  else if(step===22){

      '<p class="note">Same as before — copy what the AI wrote and paste it here so it is not lost '+

      '<a class="big" style="text-decoration:none;display:block" href="https://gemini.google.com/app" target="_blank" rel="noopener">Open Gemini</a>'+
      '<div class="grp">What gets sent</div>'+
      '<textarea id="prompt" readonly style="min-height:240px;font-size:15px">'+esc(buildInterview())+'</textarea>'+
      '<div class="grp">Before you go</div>'+
      '<div class="tally"><strong>Say your answers out loud</strong>Reading them in your head is not '+
      'the same. Practising out loud is the single best thing you can do.</div>'+
      '<button class="big" data-act="goto" data-v="16" style="margin-top:8px">Apply for another job</button>'+
      '<button class="big" data-act="goto" data-v="20" style="margin-top:8px">I\'m done for now</button>';
    hideNext=true;
  }

  else {
    h='<h1>Here\'s your cover letter prompt.</h1>'+
      '<p class="note">Same as before — copy it, open a helper, paste it in. It will write the '+
      'letter and tell you how well you match the job.</p>'+
      '<button class="big" id="copy" data-act="copy" data-v="1" style="text-align:center;background:var(--amber-soft);border-color:var(--amber)">Copy my information</button>'+
      '<div class="grp">Then open one of these</div>'+
      '<a class="big" style="text-decoration:none;display:block" href="https://claude.ai/new" target="_blank" rel="noopener">Open Claude</a>'+
      '<a class="big" style="text-decoration:none;display:block" href="https://chatgpt.com/" target="_blank" rel="noopener">Open ChatGPT</a>'+
      '<a class="big" style="text-decoration:none;display:block" href="https://gemini.google.com/app" target="_blank" rel="noopener">Open Gemini</a>'+
      '<div class="grp">What gets sent</div>'+
      '<textarea id="prompt" readonly style="min-height:240px;font-size:15px">'+esc(buildCover())+'</textarea>'+
      '<p class="note" style="margin-top:18px">When it\'s written, come back and save it the same way '+
      'you saved your resume.</p>'+
      '<button class="big" data-act="goto" data-v="22" style="text-align:center">Save my cover letter</button>'+
      '<button class="big" data-act="goto" data-v="23" style="margin-top:8px">Get ready for the interview</button>'+
      '<button class="big" data-act="goto" data-v="16" style="margin-top:8px">Apply for a different job</button>'+
      '<button class="big" data-act="reset" data-v="1" style="margin-top:8px">Start over</button>';
    hideNext=true;
  }

  M.innerHTML=h;
  NEXT.hidden=hideNext;
  if(!hideNext) NEXT.textContent=nextTxt;
  SKIP.hidden=!showSkip;
  // an empty fixed bar looks like a rendering fault, so hide it outright
  document.getElementById('foot').hidden = (hideNext && !showSkip);
  if(step===7){
    var a=document.getElementById('y1'), b=document.getElementById('y2');
    if(D.cur.y1) a.value=D.cur.y1;
    if(D.cur.y2) b.value=D.cur.y2;
  }
  window.scrollTo(0,0);
}

M.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]'); if(!b) return;
  var a=b.dataset.act, v=b.dataset.v;
  if(a==='goal'){ D.goal=v; step=21; }
  else if(a==='job'){ D.hasJob=(v==='1'); step=D.hasJob?5:10; }
  else if(a==='kind'){ D.cur.kind=(D.cur.kind===v?'':v); if(D.cur.kind!=='Professional office or firm') D.cur.prof=''; }
  else if(a==='prof'){ D.cur.prof=(D.cur.prof===v?'':v); }
  else if(a==='more'){ if(v==='1'){ D.cur={}; step=5; } else { step=10; } }
  else if(a==='ind'){
    var oe=document.getElementById('oth'); if(oe) D.other=oe.value.trim();
    toggle(D.industries,v);
  }
  else if(a==='sk'){
    var se=document.getElementById('skoth'); if(se) D.skillsOther=se.value.trim();
    toggle(D.skills,v);
  }
  else if(a==='ed'){
    D.edu.field=val('fld')||D.edu.field; D.edu.school=val('sch')||D.edu.school;
    var ce=document.getElementById('cert');   if(ce) D.edu.certs=ce.value.trim();
    var eo=document.getElementById('eduoth'); if(eo) D.edu.other=eo.value.trim();
    D.edu.levels=D.edu.levels||[]; toggle(D.edu.levels,v);
  }
  else if(a==='copy'){
    var t=document.getElementById('prompt'), btn=document.getElementById('copy');
    var done=function(){ btn.textContent='Copied — now open a helper below'; btn.style.background='var(--amber)'; };
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(t.value).then(done,function(){ t.select(); document.execCommand('copy'); done(); });
      } else { t.select(); t.setSelectionRange(0,999999); document.execCommand('copy'); done(); }
    }catch(e){ btn.textContent='Press and hold the text below to copy it'; }
    return;
  }
  else if(a==='fork'){
    var r=document.getElementById('res'); if(r) D.resume=r.value.trim();
    if(v==='yes') step=18; else if(v==='no') step=17; else if(v==='prep') step=23; else step=20;
  }
  else if(a==='goto'){ step=parseInt(v,10); }
  else if(a==='dl' || a==='mail'){
    var isCover = (v==='cover');
    var fld = document.getElementById(isCover?'cov':'res');
    if(fld){ if(isCover) D.cover=fld.value.trim(); else D.resume=fld.value.trim(); }
    var text = isCover ? D.cover : D.resume;
    var nm = (D.contact.name||'my').split(' ')[0].toLowerCase();
    if(a==='dl') saveFile(nm+(isCover?'-cover-letter.txt':'-resume.txt'), text);
    else         mailTo(isCover?'My cover letter':'My resume', text);
    save(); return;
  }
  else if(a==='reset'){ D={goal:'',target:'',target2:'',other:'',skillsOther:'',resume:'',cover:'',posting:'',postCo:'',postWhy:'',postRef:'',contact:{},jobs:[],cur:{},industries:[],skills:[],edu:{},hasJob:null}; step=1; }
  save(); render();
});

function collect(){
  if(step===3) D.contact={name:val('n'),phone:val('p'),email:val('e'),city:val('c')};
  if(step===5){ D.cur.where=val('w'); D.cur.title=val('t'); }
  if(step===7){ D.cur.y1=val('y1'); D.cur.y2=val('y2'); }
  if(step===8) D.cur.duties=val('d');
  if(step===81){ D.cur.wins=val('wins'); D.jobs.push(D.cur); D.cur={}; }
  if(step===21){ D.target=val('tg'); D.target2=val('tg2'); }
  if(step===10){ var o=document.getElementById('oth'); if(o) D.other=o.value.trim(); }
  if(step===11){ var so=document.getElementById('skoth'); if(so) D.skillsOther=so.value.trim(); }
  if(step===15) D.resume=val('res');
  if(step===22) D.cover=val('cov');
  if(step===18){ D.posting=val('post'); D.postCo=val('co'); D.postWhy=val('why'); D.postRef=val('ref'); }
  if(step===12){ D.edu.field=val('fld'); D.edu.school=val('sch');
    var c=document.getElementById('cert');   if(c)  D.edu.certs=c.value.trim();
    var eo2=document.getElementById('eduoth'); if(eo2) D.edu.other=eo2.value.trim(); }
}

NEXT.addEventListener('click',function(){
  collect();
  if(step===21) step=3;
  else if(step===6 && D.cur.kind==='Professional office or firm') step=61;
  else if(step===61) step=7;
  else if(step===8) step=81;
  else if(step===81) step=9;
  else if(step===14) step=15;
  else if(step===15) step=16;
  else if(step===17) step=18;
  else if(step===18) step=19;
  else if(step===22) step=23;
  else step=step+1;
  save(); render();
});
SKIP.addEventListener('click',function(){
  if(step===8){ D.cur.duties=val('d'); step=81; }
  else if(step===81){ D.jobs.push(D.cur); D.cur={}; step=9; }
  else if(step===21) step=3;
  else step=step+1;
  save(); render();
});
BACK.addEventListener('click',function(){
  if(step===23) step=16;
  else if(step===22) step=19;
  else if(step===19) step=18;
  else if(step===18) step=16;
  else if(step===17) step=16;
  else if(step===16) step=15;
  else if(step===15) step=14;
  else if(step===21) step=2;
  else if(step===3) step=21;
  else if(step===81) step=8;
  else if(step===9 && D.jobs.length){ D.cur=D.jobs.pop(); step=81; }
  else if(step===61) step=6;
  else if(step===7 && D.cur.kind==='Professional office or firm') step=61;
  else if(step===10 && D.hasJob===false) step=4;
  else if(step===5 && D.jobs.length) step=9;
  else step=Math.max(1,step-1);
  save(); render();
});

load();
// index.html can link to ?go=links or ?go=posting
try{
  var q=(location.search.match(/go=([a-z]+)/)||[])[1];
  if(q==='links')   step=17;
  if(q==='posting') step=18;
  if(q==='cover')   step=16;
  if(q==='interview') step=23;
}catch(e){}
render();
</script>
<script>window.JH_PAGE='resume';</script>
<script src="nav.js"></script>
</body>
